services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: angular-node-dev

    working_dir: /workspace

    volumes:
      - ./workspace:/workspace
      - node_modules_server:/workspace/server/node_modules
      - node_modules_web:/workspace/web/node_modules

    ports:
      - "3000:3000"   # Node.js
      - "4200:4200"   # Angular

    stdin_open: true
    tty: true

    command: sleep infinity

volumes:
  node_modules_server:
  node_modules_web: